# Nhắc việc tự động qua Zalo Bot, chạy miễn phí trên GitHub (không cần Vercel).
# Giờ Việt Nam: 8:00 nhắc việc sáng, 16:00 (T2-T7) việc hạn hôm nay chưa xong, 20:00 Chủ nhật báo cáo tuần, 15 phút một lần nhắc giờ hẹn.
name: Nhắc việc tự động

# Giờ chạy do máy chủ Cloudflare (cloudflare/zalo-webhook.js, hàm scheduled) gọi đúng phút, vì lịch "schedule"
# của GitHub với repo này trễ nhiều giờ (bản tin 16:00 từng tới lúc 4 giờ sáng). Mỗi bản tin còn tự kiểm khung giờ.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "daily = nhắc việc sáng, afternoon = nhắc 16:00, weekly = báo cáo tuần, inbox = chỉ đọc tin nhắn gửi bot, seed = nạp lại dữ liệu mẫu"
        default: daily
        type: choice
        options: [daily, afternoon, weekly, inbox, webhook, seed]
      update:
        description: "Máy chủ nhận tin (Cloudflare) tự điền: nội dung 1 tin Zalo cần xử lý ngay"
        default: ""
      url:
        description: "Chỉ với kind = webhook: địa chỉ máy chủ nhận tin Cloudflare (để trống = tắt, quay lại đọc tin theo lịch)"
        default: ""
      listen:
        description: "Chỉ khi thử bot: số giây ngồi chờ tin nhắn (ví dụ 300)"
        default: "0"

# Lịch chạy nối đuôi nhau; mỗi tin Zalo từ máy chủ nhận tin chạy riêng, không bị huỷ khi nhiều tin tới cùng lúc
concurrency:
  group: ${{ inputs.update != '' && format('zalo-{0}', github.run_id) || 'nhac-viec' }}

# Cho phép GitHub xin "vé" đăng nhập Google không cần khóa (Workload Identity Federation)
permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Đăng nhập Google bằng danh tính của repo này, không lưu khóa nào trên GitHub.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/940197014298/locations/global/workloadIdentityPools/github/providers/github
          service_account: nhac-viec@task-tracker-pro-809d9.iam.gserviceaccount.com
      - name: Chọn việc cần chạy
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then k="${{ inputs.kind }}";
          else k=inbox; fi
          echo "kind=$k" >> "$GITHUB_OUTPUT"
      - run: npx esbuild scripts/cron-runner.ts --bundle --platform=node --format=esm --target=node22 --packages=external --outfile=.cron/cron-runner.mjs --log-level=warning
      - run: node --conditions=react-server .cron/cron-runner.mjs ${{ steps.pick.outputs.kind }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_ADMIN_PROJECT_ID: task-tracker-pro-809d9
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # không bắt buộc: có thì bật Trợ lý AI (Gemini miễn phí)
          NEXT_PUBLIC_APP_URL: "https://xaydungvnttc-cpu.github.io/task-tracker-pro/#"
          APP_TIMEZONE: Asia/Ho_Chi_Minh
          LISTEN_SECONDS: ${{ inputs.listen || '0' }}
          ZALO_UPDATE: ${{ inputs.update }}
          WEBHOOK_URL: ${{ inputs.url }}
