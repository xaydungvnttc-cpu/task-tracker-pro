# Nhắc việc tự động qua Zalo Bot, chạy miễn phí trên GitHub (không cần Vercel).
# Giờ GitHub tính theo UTC: 01:00 UTC = 8:00 sáng Việt Nam, 13:00 UTC Chủ nhật = 20:00 Việt Nam.
# GitHub có thể chạy trễ 5-30 phút vào giờ cao điểm.
name: Nhắc việc tự động

on:
  schedule:
    - cron: "0 1 * * *" # 8:00 sáng hằng ngày
    - cron: "0 13 * * 0" # 20:00 Chủ nhật
    - cron: "*/15 * * * *" # 15 phút một lần: đọc tin nhắn gửi bot, tin quan trọng thành việc
  workflow_dispatch:
    inputs:
      kind:
        description: "daily = nhắc việc sáng, weekly = báo cáo tuần, inbox = chỉ đọc tin nhắn gửi bot"
        default: daily
        type: choice
        options: [daily, weekly, inbox]

concurrency: nhac-viec

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Chọn việc cần chạy
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then k="${{ inputs.kind }}";
          elif [ "${{ github.event.schedule }}" = "0 1 * * *" ]; then k=daily;
          elif [ "${{ github.event.schedule }}" = "0 13 * * 0" ]; then k=weekly;
          else k=inbox; fi
          echo "kind=$k" >> "$GITHUB_OUTPUT"
      - run: npx esbuild scripts/cron-runner.ts --bundle --platform=node --format=esm --target=node22 --packages=external --outfile=.cron/cron-runner.mjs --log-level=warning
      - run: node --conditions=react-server .cron/cron-runner.mjs ${{ steps.pick.outputs.kind }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NEXT_PUBLIC_APP_URL: "https://xaydungvnttc-cpu.github.io/task-tracker-pro/#"
          APP_TIMEZONE: Asia/Ho_Chi_Minh
